function creator(){if(nextEvent()){toast('请先完成当前24 站锦标赛');view='season';render();return}main.innerHTML=heading('创建一个24 站锦标赛。','设置一次，自动生成完整赛历。分站结果累积到同一张积分榜。')+'<div class="card"><form id="seasonForm"><div class="form-grid"><label>锦标赛名称<input name="name" required value="GT 24 站锦标赛" maxlength="50"></label><label>首站日期<input name="date" type="date" required value="'+new Date(world.dateTime+7*DAY).toISOString().slice(0,10)+'"></label><label>每站圈数<select name="laps"><option value="3">3 圈 · 快速体验</option><option value="5">5 圈 · 基础 1 次进站</option><option value="7">7 圈 · 基础 2 次进站</option><option value="10">10 圈 · 基础 2 次进站</option><option value="12">12 圈 · 基础 3 次进站</option><option value="15">15 圈 · 基础 3 次进站</option><option value="20">20 圈 · 基础 4 次进站</option></select></label><label>分站间隔<input value="7 天 / 每站" disabled></label></div><div class="rules-strip"><b>固定规则</b><span>全员灯灭起跑 · 交错发车格</span><span>3–6 圈至少 1 次 · 7–11 圈至少 2 次 · 12–16 圈至少 3 次</span><span>车损 ≥35% · 油量 ≤25% · 胎耗 ≥65%：自动进站</span><span>天气变化可额外换胎 · 最低 2× 播放</span><span>下站按本站名次倒序排位</span><span>每站间隔 7 天自动整备</span></div><div class="section-head"><h2>选择24 站赛道顺序</h2><small>24 ROUNDS</small></div><div class="round-editor">'+DEFAULT_SCHEDULE.map((id,i)=>{let t=getTrack(id);return '<label><small>R'+String(i+1).padStart(2,'0')+'</small><select name="track">'+circuits.map(o=>'<option value="'+o.id+'" '+(o===t?'selected':'')+'>'+o.name+'</option>').join('')+'</select></label>'}).join('')+'</div><p class="note">十支车队自动报名。积分规则：25 / 18 / 15 / 12 / 10 / 8 / 6 / 4 / 2 / 1；退赛 0 分。已开始的赛季圈数保持不变；基础次数按圈数计算，天气换胎可计入基础次数，也可产生额外进站。</p><button class="primary">创建完整24 站赛季 ↗</button></form></div>';$('seasonForm').onsubmit=guard(async e=>{e.preventDefault();let f=new FormData(e.target);createChampionship(world,{name:f.get('name'),startAt:Date.parse(f.get('date')+'T09:00:00Z'),laps:Number(f.get('laps')),trackIds:f.getAll('track'),rules:{refuelingAllowed:true,mandatoryPitStop:true}});await save();view='season';render();toast('24 站锦标赛已创建')})}

function live(){if(!sim){view='season';season();return}let e=sim.event;main.innerHTML='<div class="live-heading row"><div><div class="eyebrow">'+esc(currentChampionship(world).name)+' / ROUND '+String(e.round).padStart(2,'0')+'</div><h1>'+getTrack(e.trackIds[0]).name+'</h1><span class="progress-note">'+getTrack(e.trackIds[0]).km+' KM · '+e.rules.laps+' LAPS · '+e.entries.length+' CARS</span></div><button data-nav="season">← 积分榜</button></div><div class="stage"><canvas id="race" aria-label="比赛赛道，单指拖动、双指缩放"></canvas><div class="hud" id="liveHud"></div><div id="startLights" class="start-light-panel"></div><div id="timing" class="timing '+(showTiming?'':'hidden')+'"></div><div class="camera-buttons"><button id="overviewCam">全赛道</button><button id="leaderCam">跟随领先赛车</button><button id="eventCam">自动镜头</button></div><span class="race-note">默认全场观赛 · 点击车队可跟车</span></div><div class="controls"><button class="primary" id="pause">'+(paused?'继续 ▶':'暂停 Ⅱ')+'</button>'+[2,4,8].map(v=>'<button data-speed="'+v+'" class="'+(v===speed?'active':'')+'">'+v+'×</button>').join('')+'<button id="toggleTiming">'+(showTiming?'隐藏':'显示')+'计时排名</button><button id="focusRace">专注观赛</button><button id="fast">快速完成本站</button><button data-action="save">保存</button></div><div id="carDetail" class="car-detail"></div><div class="follow-strip">'+world.teams.map(t=>{let b=sim.cars.find(b=>b.teamId===t.id);return b?'<button data-follow="'+b.id+'"><i style="--c:'+t.color+'"></i>'+esc(t.name)+'</button>':''}).join('')+'</div>';renderer=new Renderer($('race'));renderer.timingVisible=showTiming;renderer.overview();$('focusRace').onclick=()=>{let focus=document.body?.classList.toggle('race-focus');$('focusRace').textContent=focus?'退出专注':'专注观赛'};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续 ▶':'暂停 Ⅱ';save()};$('fast').onclick=()=>{fast=true;paused=false};$('toggleTiming').onclick=toggleTiming;$('overviewCam').onclick=()=>renderer.overview();$('leaderCam').onclick=()=>renderer.setFollow(sim.order()[0]?.id);$('eventCam').onclick=()=>renderer.setFollow('auto');updateLive()}
function toggleTiming(){showTiming=!showTiming;if(renderer)renderer.timingVisible=showTiming;$('timing').classList.toggle('hidden',!showTiming);$('toggleTiming').textContent=(showTiming?'隐藏':'显示')+'计时排名';try{localStorage.setItem('apex-timing',String(showTiming))}catch{}}
function updateStartLights(){let lights=$('startLights');if(!lights||!sim)return;let state=sim.phase==='LIGHTS'?'red'+Math.floor(C.startLights-sim.countdown):'out';if(lights.dataset.state===state)return;lights.dataset.state=state;lights.style.display=sim.phase==='LIGHTS'?'flex':'none';lights.innerHTML=Array.from({length:5},(_,i)=>'<i class="'+(C.startLights-sim.countdown>=i?'lit':'')+'"></i>').join('')}
function updateLive(){if(!sim||!$('liveHud'))return;let order=sim.order(),leader=order[0],totals=new Map(scoreRows(world).map(r=>[r.team.id,r.points]));$('liveHud').innerHTML='<div><small>ROUND</small><strong>'+String(sim.event.round).padStart(2,'0')+' / '+currentChampionship(world).eventIds.length+'</strong></div><div><small>LAP</small><strong>'+Math.min(leader.lap+1,sim.event.rules.laps)+' / '+sim.event.rules.laps+'</strong></div><div><small>'+(sim.phase==='LIGHTS'?'STARTING LIGHTS':'RACE TIME')+'</small><strong>'+(sim.phase==='LIGHTS'?'准备发车':fmt(sim.time))+'</strong></div><div><small>WEATHER</small><strong>'+C.weather[sim.weather]+' · 路湿 '+Math.round(sim.wetness*100)+'%</strong></div>';
 updateStartLights();
 $('timing').innerHTML='<div class="timing-title"><span>LIVE TIMING / GAP</span><button id="closeTiming" aria-label="关闭排名">×</button></div>'+order.map((b,i)=>'<button type="button" class="timing-row" data-follow="'+b.id+'" aria-label="跟随 '+esc(b.name)+'"><span>'+String(i+1).padStart(2,'0')+'</span><i style="--c:'+b.color+'"></i><span>'+esc(b.name)+' <b class="tower-points">'+(totals.get(b.teamId)||0)+'分</b> <em class="tower-damage">车损 '+b.damage.toFixed(1)+'%</em><small class="tower-lap">'+configNumber(b.configuration)+' · '+esc(b.strategy?.mode==='UNDERCUT'?'提前进站':b.strategy?.pit?'本圈进站':'观察赛况')+' · LAST '+fmt(b.lastLap)+'</small></span><time>'+sim.timingInfo(b,leader).label+'</time></button>').join('')+'<div class="timing-footer">计时点差距 · 点击车队跟随</div>';$('closeTiming').onclick=toggleTiming;
 let watched=sim.cars.find(b=>b.id===renderer?.follow)||leader;if($('carDetail'))$('carDetail').innerHTML='<b>'+esc(watched.name)+'</b><span>'+configNumber(watched.configuration)+'</span><span>'+Math.round(Math.hypot(watched.vx,watched.vy)*3.6*sim.track.distanceScale)+' km/h</span><span>上一圈 '+fmt(watched.lastLap)+'</span><span>最快圈 '+fmt(watched.bestLap)+'</span><span>'+watched.tireType+' · 磨损 '+Math.round(watched.tireWear)+'%</span><span>油量 '+watched.fuel.toFixed(1)+'%</span><span>进站 '+watched.pitStops+' / 基础 '+requiredPitStops(sim.event.rules.laps)+'</span><span>天气换胎 '+watched.weatherPitStops+' 次</span><span>损坏 '+watched.damage.toFixed(1)+'% · '+damageLabel(watched.damage)+'</span><span>补油 '+(watched.fuelStops||0)+' 次</span><span>节奏：'+esc(watched.racePace?.mode||'观察差距')+'</span><span>策略：'+esc(watched.strategy?.reason|| (watched.aiMode.startsWith('PIT')?'执行进站服务':'观察赛况'))+'</span><span>预计进站损失 '+(watched.strategy?.pitLoss??watched.pitDecision?.pitLoss??'—')+' 秒</span><span>维修 '+watched.repairStops+' 次'+(watched.aiMode==='PIT_STOP'?' · 服务剩余 '+watched.pitClock.toFixed(1)+'s':'')+'</span>'}

function weekend(){let e=world.events.find(e=>e.id===weekendId)||nextEvent();if(!e){view='season';season();return}let track=getTrack(e.trackIds[0]),previous=world.events.find(x=>x.id===e.gridFrom);main.innerHTML=heading('第 '+e.round+' 站 · GT 发车区',track.name+' / '+track.km+' KM / '+e.rules.laps+' LAPS','<button data-nav="season">← 返回积分榜</button>')+'<div class="grid"><div class="card"><div class="circuit-thumb"><canvas id="weekendMap"></canvas></div><h2>'+track.name+'</h2><p class="note">'+e.gridMethod+'。十辆 GT 赛车在交错车位上静止等待，五盏红灯熄灭后统一起跑。每辆车本场至少完成 '+requiredPitStops(e.rules.laps)+' 次进站；天气变化时会按雨量换胎，必要时额外进站。最低播放速度为 2 倍。车损 ≥35%、油量 ≤25% 或胎耗 ≥65% 会额外请求进站。</p><button class="primary" data-race="'+e.id+'">进入正赛，准备发车 ↗</button></div><div class="card"><h2>正式发车格</h2><p class="note">'+(previous?'上一站冠军从第 10 位起步，依次倒序。':'首站抽签，后续按上一站成绩倒序。')+'</p>'+table(['车位','车队','AI 配置','上一站'],e.grid.map((tid,i)=>{let team=world.teams.find(t=>t.id===tid),rank=previous?.result.rows.find(r=>r.teamId===tid)?.rank;return[i+1,teamName(team),configNumber(e.teamSetups[tid]),rank?'P'+rank:'首站抽签']}))+'</div></div>';drawPreview('weekendMap',track.id)}
async function launch(id){if(world.currentRace){sim=sim||new Simulation(world,world.events.find(e=>e.id===world.currentRace.eventId),world.currentRace.snapshot);view='live';render();return}let e=world.events.find(e=>e.id===id);if(e.status==='REGISTRATION'){advance(world,e.startAt);confirm(world,id);prepareGrid(world,id);await save()}weekendId=id;view='weekend';render()}
async function startRace(id){let e=world.events.find(e=>e.id===id);if(!e.grid)throw Error('请先确认发车格');let event=startEvent(world,id);sim=new Simulation(world,event);paused=false;fast=false;acc=0;speed=2;view='live';render();await save()}
function raceResult(){let e=world.events.find(e=>e.id===resultId);if(!e?.result){view='season';season();return}let r=e.result,win=world.teams.find(t=>t.id===r.rows[0].teamId),next=nextEvent();main.innerHTML=heading('第 '+e.round+' 站 · 比赛结果',getTrack(e.trackIds[0]).name+' / '+fmt(r.raceDuration??r.duration)+' / '+e.rules.laps+' 圈','<button data-nav="season">回到赛季积分榜</button>')+'<div class="result-winner"><div><small>RACE WINNER</small><h1>'+teamName(win)+'</h1><p>本站冠军 · +'+r.rows[0].points+' 分</p></div><strong>01</strong></div><div class="card">'+table(['P','车队','发车位','正赛成绩','最快圈','配置','损坏','维修','积分','状态'],r.rows.map(row=>[row.rank,teamName(world.teams.find(t=>t.id===row.teamId)),row.gridPosition||'—',row.status==='FINISHED'?fmt(row.time):'—',fmt(row.bestLap),row.configuration?configNumber(row.configuration):'—',row.damage.toFixed(1)+'%',(row.repairStops||0)+' 次',row.points,row.status==='FINISHED'?'完赛':esc(row.reason)]))+'</div><div class="row" style="margin-top:18px"><p class="note">赛季积分已更新。本站结果仅在当前比赛结束后展示。</p>'+(next?'<button class="primary" data-start="'+next.id+'">前往第 '+next.round+' 站 ↗</button>':'<button class="primary" data-nav="season">查看赛季冠军 ↗</button>')+'</div>'}
async function finish(){let id=sim.event.id;settle(world,id,sim.result());advance(world,world.dateTime);paused=true;fast=false;await save();sim=null;resultId=id;view='result';render();toast('本站已完成，赛季积分已更新')}

async function action(name){if(name==='create'){view='create';render()}if(name==='save')await save();if(name==='export'){snapshot();let blob=new Blob([JSON.stringify(world,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='GT锦标赛-'+world.seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}if(name==='import')$('importFile').click();if(name==='new'){if(!window.confirm('将替换本版进度。请先导出备份，继续新建？'))return;world=newChampionshipWorld();sim=null;view='season';await save();render()}}
main.addEventListener('click',guard(async e=>{let b=e.target.closest('[data-action],[data-nav],[data-start],[data-speed],[data-follow],[data-race]');if(!b)return;if(b.dataset.action)await action(b.dataset.action);if(b.dataset.nav){view=b.dataset.nav;render()}if(b.dataset.start)await launch(b.dataset.start);if(b.dataset.race)await startRace(b.dataset.race);if(b.dataset.speed){speed=[2,4,8].includes(Number(b.dataset.speed))?Number(b.dataset.speed):2;fast=false;main.querySelectorAll('[data-speed]').forEach(el=>el.classList.toggle('active',el===b))}if(b.dataset.follow)renderer.setFollow(b.dataset.follow)}));$('nav').onclick=e=>{let b=e.target.closest('[data-nav]');if(b){view=b.dataset.nav;render()}};$('save').onclick=guard(save);$('importFile').onchange=guard(async e=>{let f=e.target.files[0];if(!f)return;let candidate=parseImport(await f.text());if(candidate.edition!=='gt-championship-6')throw Error('仅可导入当前 GT 锦标赛版备份');world=candidate;sim=world.currentRace?new Simulation(world,world.events.find(e=>e.id===world.currentRace.eventId),world.currentRace.snapshot):null;paused=true;view=sim?'live':'season';await save();render();startLoop();toast('赛季已恢复，比赛保持暂停');e.target.value=''});document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;acc=0;snapshot();save();if($('pause'))$('pause').textContent='继续 ▶'}});window.addEventListener('pagehide',()=>{snapshot();save()});
async function init(){try{let storedTiming=localStorage.getItem('apex-timing');showTiming=storedTiming===null?!touchLayout():storedTiming!=='false';world=await loadWorld()}catch(e){main.innerHTML='<div class="card"><h2>存档未能读取</h2><p class="note">'+esc(e.message)+'</p><button id="recoverImport">导入备份</button></div>';$('recoverImport').onclick=()=>$('importFile').click();return}if(!world)world=newChampionshipWorld();if(world.currentRace){sim=new Simulation(world,world.events.find(e=>e.id===world.currentRace.eventId),world.currentRace.snapshot);view='live';paused=true}render();await save();startLoop()}
function startLoop(){if(!loopStarted){loopStarted=true;requestAnimationFrame(frame)}}function frame(now){let dt=Math.min((now-last)/1000||0,.1);last=now;if(sim&&!paused&&!sim.done&&!finishing){if(fast){for(let i=0;i<(touchLayout()?120:900)&&!sim.done;i++)sim.step()}else{acc+=dt*speed;let steps=0;while(acc>=C.dt&&steps++<100&&!sim.done){sim.step();acc-=C.dt}}if(sim.done){finishing=true;finish().catch(e=>toast(e.message)).finally(()=>finishing=false)}}if(sim&&view==='live')updateStartLights();if(sim&&view==='live'&&renderer&&!fast&&(!touchLayout()||now-drawTime>=1000/30)){renderer.draw(sim);drawTime=now;}ui+=dt;autoSave+=dt;if(ui>.25){updateLive();ui=0}if(autoSave>5){if(sim)save();autoSave=0}requestAnimationFrame(frame)}
init().catch(e=>{main.innerHTML='<div class="card">加载失败：'+esc(e.message)+'</div>';console.error(e)});

return {};
})();
