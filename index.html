function live(){if(!sim){view='season';season();return}let e=sim.event;main.innerHTML='<div class="live-heading row"><div><div class="eyebrow">'+esc(currentChampionship(world).name)+' / ROUND '+String(e.round).padStart(2,'0')+'</div><h1>'+getTrack(e.trackIds[0]).name+'</h1><span class="progress-note">'+getTrack(e.trackIds[0]).km+' KM · '+e.rules.laps+' LAPS · '+(e.carEntries||e.entries).length+' CARS</span></div><button data-nav="season">← 积分榜</button></div><div class="stage"><canvas id="race" aria-label="比赛赛道，单指拖动、双指缩放"></canvas><div class="hud" id="liveHud"></div><div id="startLights" class="start-light-panel"></div><div id="timing" class="timing '+(showTiming?'':'hidden')+'"></div><div class="camera-buttons"><button id="overviewCam">全赛道</button><button id="leaderCam">跟随领先赛车</button><button id="eventCam">自动镜头</button></div><span class="race-note">默认全场观赛 · 点击车队可跟车</span></div><div id="raceStory" class="race-story" aria-live="off"></div><div class="controls"><button class="primary" id="pause">'+(paused?'继续 ▶':'暂停 Ⅱ')+'</button>'+[2,4,8].map(v=>'<button data-speed="'+v+'" class="'+(v===speed?'active':'')+'">'+v+'×</button>').join('')+'<button id="expandTiming" aria-expanded="'+fullTiming+'">'+(fullTiming?'收起全榜':'展开全榜')+'</button><button id="toggleTiming">'+(showTiming?'隐藏':'显示')+'计时排名</button><button id="focusRace">专注观赛</button><button id="fast">快速完成本站</button><button data-action="save">保存</button></div><div id="carDetail" class="car-detail"></div><div class="follow-strip">'+sim.cars.map(b=>{let t=world.teams.find(t=>t.id===b.teamId)||{color:b.color};return b?'<button data-follow="'+b.id+'"><i style="--c:'+t.color+'"></i>'+esc(b.name)+'</button>':''}).join('')+'</div>';renderer=new Renderer($('race'));renderer.timingVisible=showTiming;renderer.timingFull=fullTiming;renderer.overview();$('race').parentElement?.classList.toggle('full-board',fullTiming&&showTiming);$('expandTiming').onclick=toggleFullTiming;$('focusRace').onclick=()=>{let focus=document.body?.classList. function toggleFullTiming(){fullTiming=!fullTiming;showTiming=true;if(renderer){renderer.timingFull=fullTiming;renderer.timingVisible=true}$('timing').classList.remove('hidden');$('timing').classList.toggle('is-full',fullTiming);$('race').parentElement?.classList.toggle('full-board',fullTiming);$('expandTiming').textContent=fullTiming?'收起全榜':'展开全榜';$('expandTiming').setAttribute('aria-expanded',String(fullTiming));$('toggleTiming').textContent='隐藏计时排名';try{localStorage.setItem('apex-full-timing',String(fullTiming));localStorage.setItem('apex-timing','true')}catch{}updateLive()}

function updateStartLights(){let lights=$('startLights');if(!lights||!sim)return;let state=sim.phase==='LIGHTS'?'red'+Math.floor(C.startLights-sim.countdown):'out';if(lights.dataset.state===state)return;lights.dataset.state=state;lights.style.display=sim.phase==='LIGHTS'?'flex':'none';lights.innerHTML=Array.from({length:5},(_,i)=>'<i class="'+(C.startLights-sim.countdown>=i?'lit':'')+'"></i>').join('')}
function updateLive(){if(!sim||!$('liveHud'))return;let order=sim.order(),leader=order[0],totals=new Map(scoreRows(world).map(r=>[r.team.id,r.points]));$('liveHud').innerHTML='<div><small>ROUND</small><strong>'+String(sim.event.round).padStart(2,'0')+' / '+currentChampionship(world).eventIds.length+'</strong></div><div><small>LAP</small><strong>'+Math.min(leader.lap+1,sim.event.rules.laps)+' / '+sim.event.rules.laps+'</strong></div><div><small>'+(sim.phase==='LIGHTS'?'STARTING LIGHTS':'RACE TIME')+'</small><strong>'+(sim.phase==='LIGHTS'?'准备发车':fmt(sim.time))+'</strong></div><div><small>WEATHER</small><strong>'+C.weather[sim.weather]+' · 路湿 '+Math.round(sim.wetness*100)+'%</strong></div>';
 updateStartLights();if($('raceStory')){let focus=battleFocus(sim),car=sim.cars.find(b=>b.id===focus.id),contact=[...sim.logs].reverse().find(e=>e.type==='接触'&&sim.time-e.time<3);$('raceStory').textContent=(sim.phase==='LIGHTS'?'五灯熄灭后统一发车':focus.reason+(car?' · #'+raceNumber(car)+' '+car.name:''))+(contact?' ｜ '+contact.text:'')+' ｜ '+circuitProfile(sim.track).name+' ｜ '+roadForecast(sim.weather,sim.wetness,sim.roadObservation?.trend).label}
 $('timing').classList.toggle('is-full',fullTiming);$('timing').innerHTML='<div class="timing-title"><span>'+(fullTiming?'完整榜单 / 22 辆赛车':'LIVE TIMING / GAP')+'</span><button id="closeTiming" aria-label="关闭排名">×</button></div><div class="timing-entries">'+timingRows(sim,totals,fullTiming)+'</div><div class="timing-footer">'+(fullTiming?'第 1–22 名 · 单列排行 · 点击跟车':'领先差距 / 前车差距 · 点击跟车')+'</div>';$('closeTiming').onclick=toggleTiming;
 let watched=sim.cars.find(b=>b.id===(renderer?.follow==='auto'?renderer.autoTarget:renderer?.follow))||leader;if($('carDetail'))$('carDetail').innerHTML='<b>#'+raceNumber(watched)+' '+esc(watched.name)+'</b><span>'+configNumber(watched.configuration)+'</span><span>'+Math.round(Math.hypot(watched.vx,watched.vy)*3.6*sim.track.distanceScale)+' km/h</span><span>'+ (watched.status==='FINISHED'?'已冲线 · 减速等待其他赛车':'比赛中')+'</span><span>上一圈 '+fmt(watched.lastLap)+'</span><span>最快圈 '+fmt(watched.bestLap)+'</span><span>'+watched.tireType+' · 磨损 '+Math.round(watched.tireWear)+'%</span><span>油量 '+watched.fuel.toFixed(1)+'%</span><span>进站 '+(watched.regularPitStops||0)+' / 上限 '+maximumPitStops(sim.event.rules.laps)+'</span><span>换胎 '+(watched.regularTireChanges||0)+' / 2 次 · 天气换胎 '+watched.weatherPitStops+' 次</span><span>损坏 '+watched.damage.toFixed(1)+'% · '+damageLabel(watched.damage)+'</span><span>补油 '+(watched.fuelStops||0)+' 次</span><span>基础服务 '+(watched.regularPitStops||0)+' / '+(sim.event.rules.requiredPitStops??requiredPitStops(sim.event.rules.laps))+' 次</span><span>紧急 '+(watched.emergencyPitStops||0)+' 次 · 电能 '+Math.round(watched.energy||0)+'%'+(watched.energyDeploy?' · 释放':'')+'</span><span>弯道：'+esc(watched.battle||'观察线路')+'</span><span>节奏：'+esc(watched.racePace?.mode||'观察差距')+'</span><span>策略：'+esc(watched.strategy?.reason|| (watched.aiMode.startsWith('PIT')?'执行进站服务':'观察赛况'))+'</span><span>收官判断：'+(watched.strategy?.endgame?Math.max(0,watched.strategy.lapsLeft).toFixed(1)+' 圈剩余 · '+(watched.strategy?.mode==='SPRINT'?'留场争名次':'评估必要服务'):'正常比赛')+'</span><span>预计进站损失 '+(watched.strategy?.pitLoss??watched.pitDecision?.pitLoss??'—')+' 秒</span><span>维修 '+watched.repairStops+' 次'+(watched.aiMode==='PIT_STOP'?' · 服务剩余 '+watched.pitClock.toFixed(1)+'s':'')+ '</span><span>'+esc(watched.energyMode||'保存电能')+'</span><span>胎温 '+Math.round(watched.tireTemperature??82)+'°C</span><span>若现在进站，估计出站名次 '+(watched.strategy?.predictedPosition?'P'+watched.strategy.predictedPosition:'—')+'</span><span>'+esc(roadForecast(sim.weather,sim.wetness,sim.roadObservation?.trend).label)+' · 30 秒趋势估计</span>'}

function weekend(){let e=world.events.find(e=>e.id===weekendId)||nextEvent();if(!e){view='season';season();return}let track=getTrack(e.trackIds[0]),previous=world.events.find(x=>x.id===e.gridFrom);main.innerHTML=heading('第 '+e.round+' 站 · 方程式发车区',track.name+' / '+track.km+' KM / '+e.rules.laps+' LAPS','<button data-nav="season">← 返回积分榜</button>')+'<div class="grid"><div class="card"><div class="circuit-thumb"><canvas id="weekendMap"></canvas></div><h2>'+track.name+'</h2><p class="note">'+e.gridMethod+'。22 辆 方程式赛车在交错车位上静止等待，五盏红灯熄灭后统一起跑。每辆车本场至少完成 '+(e.rules.requiredPitStops??requiredPitStops(e.rules.laps))+' 次基础停靠；不更换车手，补油、轮胎、修理按需要决定。天气变化时会按雨量换胎，普通可选额外进站 1 次，普通换胎最多 2 次；危险情况可紧急服务；天气换胎独立计数。最低播放速度为 2 倍。车损 ≥8%、低油量或轮胎衰退时评估进站收益，避免无效停站。</p><button class="primary" data-race="'+e.id+'">进入正赛，准备发车 ↗</button></div><div class="card"><h2>正式发车格</h2><p class="note">'+(previous?'上一站冠军从末位起步，依次倒序。':'首站抽签，后续按上一站成绩倒序。')+'</p>'+table(['车位','车队','AI 配置','上一站','参赛判断'],e.grid.map((key,i)=>{let v=world.vehicles.find(v=>e.carEntries?v.id===key:v.teamId===key),tid=v.teamId,team=world.teams.find(t=>t.id===tid),rank=previous?.result.rows.find(r=>r.vehicleId===v.id)?.rank;return[i+1,teamName(team)+' · '+(v.carNumber||1)+'号车',configNumber(e.teamSetups[tid]),rank?'P'+rank:'首站抽签',e.nonStarters?.[key]?esc(e.nonStarters[key].reason):'正常参赛']}))+'</div></div>';drawPreview('weekendMap',track.id)}
async function launch(id){if(world.currentRace){sim=sim||new Simulation(world,world.events.find(e=>e.id===world.currentRace.eventId),world.currentRace.snapshot);view='live';render();return}let e=world.events.find(e=>e.id===id);if(e.status==='REGISTRATION'){advance(world,e.startAt);confirm(world,id);prepareGrid(world,id);await save()}weekendId=id;view='weekend';render()}
async function startRace(id){let e=world.events.find(e=>e.id===id);if(!e.grid)throw Error('请先确认发车格');let event=startEvent(world,id);sim=new Simulation(world,event);paused=false;fast=false;acc=0;speed=2;view='live';render();await save()}
function raceResult(){let e=world.events.find(e=>e.id===resultId);if(!e?.result){view='season';season();return}let r=e.result,win=world.teams.find(t=>t.id===r.rows[0].teamId),next=nextEvent();main.innerHTML=heading('第 '+e.round+' 站 · 比赛结果',getTrack(e.trackIds[0]).name+' / '+fmt(r.raceDuration??r.duration)+' / '+e.rules.laps+' 圈','<button data-nav="season">回到赛季积分榜</button>')+'<div class="result-winner"><div><small>RACE WINNER</small><h1>'+teamName(win)+'</h1><p>本站冠军 · +'+r.rows[0].points+' 分</p></div><strong>01</strong></div><div class="rules-strip">有效超车 '+(r.stats?.effectivePasses??r.stats?.passes??0)+' 次 · 领先交替 '+(r.stats?.leadChanges||0)+' 次 · 近距离争夺 '+Math.round(r.stats?.battlePairSeconds||0)+' 秒（多组累计）</div><div class="card">'+table(['P','车队','发车位','正赛成绩','最快圈','配置','损坏','维修','积分','状态'],r.rows.map(row=>[row.rank,teamName(world.teams.find(t=>t.id===row.teamId))+' · '+(row.carNumber||1)+'号车',row.gridPosition||'—',row.status==='FINISHED'?fmt(row.time):'—',fmt(row.bestLap),row.configuration?configNumber(row.configuration):'—',row.damage.toFixed(1)+'%',(row.repairStops||0)+' 次',row.points,row.status==='FINISHED'?'完赛':esc(row.reason)]))+'</div><div class="row" style="margin-top:18px"><p class="note">赛季积分已更新。本站结果仅在当前比赛结束后展示。</p>'+(next?'<button class="primary" data-start="'+next.id+'">前往第 '+next.round+' 站 ↗</button>':'<button class="primary" data-nav="season">查看赛季冠军 ↗</button>')+'</div>'}
async function finish(){let id=sim.event.id;settle(world,id,sim.result());advance(world,world.dateTime);paused=true;fast=false;await save();sim=null;resultId=id;view='result';render();toast('本站已完成，赛季积分已更新')}

async function action(name){if(name==='create'){view='create';render()}if(name==='save')await save();if(name==='export'){snapshot();let blob=new Blob([JSON.stringify(world,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='GT锦标赛-'+world.seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}if(name==='import')$('importFile').click();if(name==='new'){if(!window.confirm('将替换本版进度。请先导出备份，继续新建？'))return;world=newChampionshipWorld();sim=null;view='season';await save();render()}}
main.addEventListener('click',guard(async e=>{let b=e.target.closest('[data-action],[data-nav],[data-start],[data-speed],[data-follow],[data-race]');if(!b)return;if(b.dataset.action)await action(b.dataset.action);if(b.dataset.nav){view=b.dataset.nav;render()}if(b.dataset.start)await launch(b.dataset.start);if(b.dataset.race)await startRace(b.dataset.race);if(b.dataset.speed){speed=[2,4,8].includes(Number(b.dataset.speed))?Number(b.dataset.speed):2;fast=false;main.querySelectorAll('[data-speed]').forEach(el=>el.classList.toggle('active',el===b))}if(b.dataset.follow)renderer.setFollow(b.dataset.follow)}));$('nav').onclick=e=>{let b=e.target.closest('[data-nav]');if(b){view=b.dataset.nav;render()}};$('save').onclick=guard(save);$('importFile').onchange=guard(async e=>{let f=e.target.files[0];if(!f)return;let candidate=parseImport(await f.text());if(candidate.edition!=='gt-championship-6')throw Error('仅可导入当前 GT 锦标赛版备份');world=candidate;sim=world.currentRace?new Simulation(world,world.events.find(e=>e.id===world.currentRace.eventId),world.currentRace.snapshot):null;paused=true;view=sim?'live':'season';await save();render();startLoop();toast('赛季已恢复，比赛保持暂停');e.target.value=''});document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;acc=0;snapshot();save();if($('pause'))$('pause').textContent='继续 ▶'}});window.addEventListener('pagehide',()=>{snapshot();save()});
async function init(){try{let storedTiming=localStorage.getItem('apex-timing');showTiming=storedTiming===null?!touchLayout():storedTiming!=='false';fullTiming=localStorage.getItem('apex-full-timing')==='true';world=await loadWorld()}catch(e){main.innerHTML='<div class="card"><h2>存档未能读取</h2><p class="note">'+esc(e.message)+'</p><button id="recoverImport">导入备份</button></div>';$('recoverImport').onclick=()=>$('importFile').click();return}if(!world)world=newChampionshipWorld();if(world.currentRace){sim=new Simulation(world,world.events.find(e=>e.id===world.currentRace.eventId),world.currentRace.snapshot);view='live';paused=true}render();await save();startLoop()}
function startLoop(){if(!loopStarted){loopStarted=true;requestAnimationFrame(frame)}}function frame(now){let dt=Math.min((now-last)/1000||0,.1);last=now;if(sim&&!paused&&!sim.done&&!finishing){if(fast){for(let i=0;i<(touchLayout()?120:900)&&!sim.done;i++)sim.step()}else{acc+=dt*speed;let steps=0;while(acc>=C.dt&&steps++<100&&!sim.done){sim.step();acc-=C.dt}}if(sim.done){finishing=true;finish().catch(e=>toast(e.message)).finally(()=>finishing=false)}}if(sim&&view==='live')updateStartLights();if(sim&&view==='live'&&renderer&&!fast&&(!touchLayout()||now-drawTime>=1000/30)){renderer.draw(sim);drawTime=now;}ui+=dt;autoSave+=dt;if(ui>.25){updateLive();ui=0}if(autoSave>5){if(sim)save();autoSave=0}requestAnimationFrame(frame)}
init().catch(e=>{main.innerHTML='<div class="card">加载失败：'+esc(e.message)+'</div>';console.error(e)});

return {};
})();
